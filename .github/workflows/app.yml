name: PricePulse CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pricepulse
          POSTGRES_PASSWORD: pricepulse
          POSTGRES_DB: pricepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pricepulse -d pricepulse_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test environment
        run: echo "DATABASE_URL=postgresql+psycopg://pricepulse:pricepulse@localhost:5432/pricepulse_test" > .env.test

      - name: Run tests
        run: pytest -v

